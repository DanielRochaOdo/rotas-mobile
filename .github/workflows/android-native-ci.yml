name: Android Web Parity CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kotlin
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-key
      DASHBOARD_URL: https://example.supabase.co
      DASHBOARD_ANON_KEY: ci-placeholder-dashboard-key

    steps:
      - name: Checkout Android repository
        uses: actions/checkout@v5

      - name: Checkout web source of truth
        uses: actions/checkout@v5
        with:
          repository: DanielRochaOdo/Odontoart-rotas
          path: web-reference
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-reference/package-lock.json

      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew

      - name: Build debug APK with exact web runtime
        run: ./gradlew assembleDebug --stacktrace

      - name: Ensure exact web runtime is active
        run: |
          grep -q 'WebViewAssetLoader' app/src/main/java/com/odontoart/rotas/MainActivity.kt
          grep -q 'buildWebRuntime' app/build.gradle.kts
          test -f app/src/main/assets/index.html
          test -d app/src/main/assets/assets

      - name: Ensure server secrets are not embedded
        run: |
          if grep -E 'buildConfigField\([^\n]*(SERVICE_ROLE|CRON_SECRET|DASH_SYNC_)' app/build.gradle.kts; then
            echo 'Server-only secret/config found in Android BuildConfig.'
            exit 1
          fi

      - name: Ensure APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
