name: Android Native CI

on:
  push:
    branches:
      - refactor/android-native-kotlin
  pull_request:
    branches:
      - main

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kotlin
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew

      - name: Build native debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Ensure WebView is not used by Kotlin sources
        run: |
          if grep -R --line-number --include='*.kt' 'android.webkit.WebView\|WebViewAssetLoader\|JavascriptInterface' app/src/main/java; then
            echo 'WebView/web bridge usage found in native Android sources.'
            exit 1
          fi

      - name: Ensure Android build does not depend on web dist
        run: |
          if grep -R --line-number 'syncWebAssets\|../dist\|npm run build' app/build.gradle.kts; then
            echo 'Web build dependency found in Android Gradle configuration.'
            exit 1
          fi
